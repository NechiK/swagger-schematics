version: 2
updates:
  - package-ecosystem: npm
    directory: /projects/swagger-schematics
    schedule:
      interval: weekly
    groups:
      # One PR for all minor/patch bumps; majors stay as separate PRs so
      # they are visible but unmerged.
      minor-and-patch:
        update-types:
          - minor
          - patch
      # The @angular-devkit/* + @schematics/angular packages version in
      # lockstep - a tree mixing majors breaks the schematics runtime, so
      # the Angular major migration must arrive as ONE atomic PR, never
      # as per-package bumps.
      angular-major:
        patterns:
          - "@angular-devkit/*"
          - "@schematics/angular"
        update-types:
          - major

  # The compat projects pin one Angular major each; a new major gets its own
  # compat/angular-<version> project instead of a bump here. TypeScript stays
  # on the minor that Angular major supports.
  - package-ecosystem: npm
    directories:
      - /compat/angular-15
      - /compat/angular-22
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-minor"]
    groups:
      compat:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
