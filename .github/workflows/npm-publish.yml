name: Run npm publish script

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            projects/swagger-schematics/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix projects/swagger-schematics

      - name: Build
        run: npm run build

      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "swagger-schematics@$VERSION" version >/dev/null 2>&1; then
            echo "swagger-schematics@$VERSION already published, skipping"
            exit 0
          fi
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="${VERSION#*-}"
            TAG="${PRERELEASE%%.*}"
          else
            TAG="latest"
          fi
          echo "Publishing $VERSION with tag $TAG"
          npm publish --access public --tag "$TAG"
        working-directory: projects/swagger-schematics
