name: CI

on:
  pull_request:
    branches:
      - develop
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirrors "engines" in projects/swagger-schematics/package.json:
        # ^22.22.3 || ^24.15.0 || >=26.0.0
        node-version: [22.22.3, 24.15.0, 26.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: projects/swagger-schematics/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix projects/swagger-schematics

      - name: Lint
        run: npm run lint

      - name: Type-check tests
        run: npm run test:types --prefix projects/swagger-schematics

      - name: Test
        run: npm run test:coverage --prefix projects/swagger-schematics

      - name: Build
        run: npm run build

  angular-compat:
    # Type-checks the generated Angular output against the lowest supported
    # Angular version and the current major (see compat/).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        angular: [15, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            projects/swagger-schematics/package-lock.json
            compat/angular-${{ matrix.angular }}/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix projects/swagger-schematics
          npm ci --prefix compat/angular-${{ matrix.angular }}

      - name: Generate Angular output
        run: npm run compat:generate --prefix projects/swagger-schematics

      - name: Type-check against Angular ${{ matrix.angular }}
        run: npm run typecheck --prefix compat/angular-${{ matrix.angular }}
