name: Run npm publish script

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'projects/swagger-schematics/**'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.check.outputs.should-publish }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check whether the version is already published
        id: check
        run: |
          VERSION=$(node -p "require('./projects/swagger-schematics/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "swagger-schematics@$VERSION" version >/dev/null 2>&1; then
            echo "swagger-schematics@$VERSION already published - skipping publish job"
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "swagger-schematics@$VERSION not on npm yet - publishing"
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          fi

  npm-publish:
    needs: check-version
    if: needs.check-version.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: projects/swagger-schematics/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix projects/swagger-schematics

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="${VERSION#*-}"
            TAG="${PRERELEASE%%.*}"
          else
            TAG="latest"
          fi
          echo "Publishing $VERSION with tag $TAG"
          npm publish --access public --tag "$TAG"
        working-directory: projects/swagger-schematics
