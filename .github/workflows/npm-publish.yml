name: Run npm publish script

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix projects/swagger-schematics

      - name: Build
        run: npm run build

      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="${VERSION#*-}"
            TAG="${PRERELEASE%%.*}"
          else
            TAG="latest"
          fi
          echo "Publishing $VERSION with tag $TAG"
          npm publish --access public --tag "$TAG"
        working-directory: projects/swagger-schematics
